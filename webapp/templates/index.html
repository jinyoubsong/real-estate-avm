<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AVM 가격산정 추계</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; font-size: 13px; margin-top: 0; margin-bottom: 24px; }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 6px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    margin-top: 8px; padding: 10px; font-size: 14px; font-weight: bold;
    background: #1a1a2e; color: white; border: none; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #0f0f1e; }
  .hint { color: #888; font-size: 12px; margin-top: -8px; }
</style>
</head>
<body>
<h1>부동산 가격산정 추계</h1>
<p class="sub">위치를 입력하면 학습된 모델로 추정가를 계산합니다. (지번주소는 VWorld로 자동 좌표 조회)</p>

<form action="/estimate" method="post">
  <div>
    <label for="property_type">부동산 유형</label>
    <select id="property_type" name="property_type">
      {% for t in property_types %}
      <option value="{{ t }}">{{ labels[t] }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="row">
    <div>
      <label for="region_name">시도/시군구</label>
      <input id="region_name" name="region_name" type="text" placeholder="서울특별시 종로구" />
    </div>
    <div>
      <label for="dong">법정동</label>
      <input id="dong" name="dong" type="text" placeholder="숭인동" />
    </div>
    <div>
      <label for="jibun">지번</label>
      <input id="jibun" name="jibun" type="text" placeholder="766" />
    </div>
  </div>
  <p class="hint">세 항목을 조합해 주소를 만들어 좌표를 조회합니다. 최소 한 항목은 입력해 주세요.</p>

  <div class="row">
    <div>
      <label for="building_dong">건물동 <span style="font-weight:normal;color:#999;">(선택)</span></label>
      <input id="building_dong" name="building_dong" type="text" placeholder="104동" />
    </div>
    <div>
      <label for="ho">호수 <span style="font-weight:normal;color:#999;">(선택)</span></label>
      <input id="ho" name="ho" type="text" placeholder="1301호" />
    </div>
  </div>
  <p class="hint">건물동/호수를 알면 건축물대장에서 면적·층을 더 정확히 자동조회합니다 (아파트/오피스텔 등 집합건물).</p>

  <div class="row">
    <div>
      <label for="area_m2">전용/건물면적(㎡) <span style="font-weight:normal;color:#999;">(비우면 자동조회)</span></label>
      <input id="area_m2" name="area_m2" type="number" step="0.01" placeholder="비워두면 건축물대장에서 조회" />
    </div>
    <div>
      <label for="floor">층 <span style="font-weight:normal;color:#999;">(선택)</span></label>
      <input id="floor" name="floor" type="number" placeholder="10" />
    </div>
    <div>
      <label for="build_year">건축년도 <span style="font-weight:normal;color:#999;">(비우면 자동조회)</span></label>
      <input id="build_year" name="build_year" type="number" placeholder="비워두면 건축물대장에서 조회" />
    </div>
  </div>
  <p class="hint">면적/건축년도를 비워두면 입력한 위치로 건축물대장을 자동조회합니다 (공공데이터포털 키 필요, 아직 활용신청 승인 전이면 직접 입력해 주세요).</p>

  <button type="submit">추정가 계산</button>
</form>
</body>
</html>
